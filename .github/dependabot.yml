version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      testing:
        patterns: ["xunit*", "Testcontainers*", "Microsoft.NET.Test.Sdk", "coverlet*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
